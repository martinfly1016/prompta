<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">16:9画像を9:16に縦長化する例</title>
  <desc id="desc">横長の16:9画像から、主体を大きく保ったまま上下背景だけを自然に拡張して9:16へ変換する比較図。</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset="0.55" stop-color="#f9c6a7"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#aebed0"/>
    </linearGradient>
    <linearGradient id="character" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="619" rx="22" fill="#ffffff" stroke="#dbe4ee"/>

  <text x="104" y="92" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">16:9 元画像</text>
  <text x="762" y="92" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">9:16 縦長化</text>

  <g transform="translate(76 144)">
    <rect width="512" height="288" rx="18" fill="url(#sky)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="426" cy="60" r="38" fill="#fff4bf" opacity="0.95"/>
    <rect x="0" y="220" width="512" height="68" fill="url(#ground)"/>
    <g opacity="0.35" fill="#6b7f9b">
      <rect x="40" y="126" width="62" height="94" rx="4"/>
      <rect x="120" y="98" width="80" height="122" rx="4"/>
      <rect x="318" y="112" width="64" height="108" rx="4"/>
      <rect x="398" y="138" width="76" height="82" rx="4"/>
    </g>
    <g transform="translate(220 74)" filter="url(#shadow)">
      <ellipse cx="40" cy="200" rx="46" ry="11" fill="#1e293b" opacity="0.22"/>
      <circle cx="42" cy="34" r="28" fill="#ffd7be"/>
      <path d="M16 32c4-27 47-34 58-7 4 10 1 24-4 31-2-16-12-26-28-27-17-1-26 9-31 24-5-5-7-13-5-21z" fill="#263241"/>
      <path d="M15 86c10-23 43-28 58-1 18 32 19 76 7 113H6c-12-38-7-80 9-112z" fill="url(#character)"/>
      <path d="M18 110c-24 20-37 46-41 78" stroke="#ffd7be" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M72 110c26 18 42 43 48 75" stroke="#ffd7be" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M24 197l-10 58" stroke="#263241" stroke-width="15" stroke-linecap="round"/>
      <path d="M62 197l11 58" stroke="#263241" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(646 144)">
    <rect width="288" height="512" rx="18" fill="url(#sky)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="230" cy="84" r="34" fill="#fff4bf" opacity="0.95"/>
    <rect x="0" y="390" width="288" height="122" fill="url(#ground)"/>
    <g opacity="0.32" fill="#6b7f9b">
      <rect x="22" y="210" width="48" height="180" rx="4"/>
      <rect x="204" y="178" width="54" height="212" rx="4"/>
      <rect x="86" y="242" width="46" height="148" rx="4"/>
    </g>
    <g transform="translate(102 182)" filter="url(#shadow)">
      <ellipse cx="40" cy="200" rx="46" ry="11" fill="#1e293b" opacity="0.22"/>
      <circle cx="42" cy="34" r="28" fill="#ffd7be"/>
      <path d="M16 32c4-27 47-34 58-7 4 10 1 24-4 31-2-16-12-26-28-27-17-1-26 9-31 24-5-5-7-13-5-21z" fill="#263241"/>
      <path d="M15 86c10-23 43-28 58-1 18 32 19 76 7 113H6c-12-38-7-80 9-112z" fill="url(#character)"/>
      <path d="M18 110c-24 20-37 46-41 78" stroke="#ffd7be" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M72 110c26 18 42 43 48 75" stroke="#ffd7be" stroke-width="13" stroke-linecap="round" fill="none"/>
      <path d="M24 197l-10 58" stroke="#263241" stroke-width="15" stroke-linecap="round"/>
      <path d="M62 197l11 58" stroke="#263241" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(585 315)" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 22h70"/>
    <path d="M48 0l22 22-22 22"/>
  </g>

  <g transform="translate(770 566)">
    <rect x="-14" y="-28" width="254" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="0" y="4" fill="#1e3a8a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700">上下だけ自然に拡張</text>
  </g>
</svg>
