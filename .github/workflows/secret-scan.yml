name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        # Scan the current tree only. Older commits still contain credentials
        # until a separate history rewrite; a full-history scan would fail
        # this PR on purpose. --redact keeps secret text out of the log.
        run: gitleaks detect --no-git --source . --redact --config .gitleaks.toml --verbose
